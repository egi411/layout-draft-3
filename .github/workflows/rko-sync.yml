name: rko-sync
on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: rko-sync
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/rko-sync.mjs
        env:
          RKO_API_KEY: ${{ secrets.RKO_API_KEY }}
      - run: |
          git add data
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898099+github-actions[bot]@users.noreply.github.com" commit -m "Обновление данных"
          git push
